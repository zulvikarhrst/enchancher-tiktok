<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Radical redesign: split layout, neon accents */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html,body { height: 100%; }
        body {
            font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
            background: linear-gradient(180deg, #06070a 0%, #0b1220 50%, #07102a 100%);
            color: #e6eef8;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px;
        }

        .split {
            width: min(100%, 1100px);
            height: min(90vh, 760px);
            display: grid;
            grid-template-columns: 1fr 480px;
            gap: 28px;
            align-items: stretch;
        }

        .panel {
            background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
            border: 1px solid rgba(255,255,255,0.03);
            border-radius: 20px;
            padding: 40px 40px;
            display:flex;
            flex-direction:column;
            gap:18px;
            box-shadow: 0 10px 40px rgba(3,7,18,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
        }

        .panel h2 { font-size: 2.2rem; letter-spacing: -0.02em; color:#f8fafc; }
        .panel p.lead { color: #bfdbfe; max-width: 42ch; line-height:1.6; }

        .features { margin-top:12px; display:grid; gap:10px; }
        .feat { display:flex; gap:12px; align-items:flex-start; }
        .tag { width:44px; height:44px; border-radius:10px; background:linear-gradient(135deg,#06b6d4,#7c3aed); display:flex; align-items:center; justify-content:center; color:#020617; font-weight:700; }
        .feat .t { color:#c7d2fe; font-weight:700; }
        .feat .d { color:#93c5fd; font-size:0.95rem; }

        .right {
            display:flex; flex-direction:column; gap:18px; justify-content:center; align-items:center;
        }

        .uploader {
            width: 100%;
            height: 100%;
            background: radial-gradient( circle at 30% 20%, rgba(124,58,237,0.08), transparent 15% ), rgba(2,6,23,0.6);
            border-radius: 20px;
            padding: 34px 28px;
            display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
            border: 1px solid rgba(124,58,237,0.12);
        }

        .drop-circle {
            width: 320px; height: 320px; border-radius: 50%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
            background: radial-gradient(circle at 40% 35%, rgba(34,197,94,0.06), transparent 30%), linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
            border: 2px dashed rgba(124,58,237,0.22);
            transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
            box-shadow: 0 18px 50px rgba(7,10,20,0.6);
        }
        .drop-circle.drag-over { transform: scale(1.03); border-color: rgba(34,197,94,0.9); box-shadow: 0 30px 80px rgba(34,197,94,0.06); }
        .drop-circle .icon { font-size: 68px; color: #c7f9e3; }
        .drop-circle .title { font-weight:800; font-size:1.15rem; color:#e6fdf2; }
        .drop-circle .sub { color:#bde8cc; font-size:0.95rem; }

        .file-info { margin-top: 12px; text-align:center; color:#d1fae5; }

        .action-row { width:100%; display:flex; gap:12px; justify-content:center; align-items:center; margin-top:8px; }
        .btn-primary { background: linear-gradient(90deg,#06b6d4,#7c3aed); color:#021024; padding:14px 22px; border-radius:12px; font-weight:800; border:none; cursor:pointer; box-shadow: 0 12px 30px rgba(124,58,237,0.18); }
        .btn-muted { background: transparent; color:#9fbfdf; border:1px solid rgba(255,255,255,0.05); padding:10px 14px; border-radius:10px; cursor:pointer; }

        .status { margin-top:12px; color:#a7f3d0; }

        /* responsive */
        @media (max-width:1000px){ .split{ grid-template-columns: 1fr; height:auto; } .right{ order:-1 } .drop-circle{ width:260px; height:260px } }
    </style>
</head>
    <body>
    <div style="max-width:720px; width:100%;">
        <main style="display:flex;flex-direction:column;align-items:center;gap:20px;padding:36px;">
            <h1 style="font-size:28px;margin-bottom:4px;">Clean Uploader</h1>
            <div style="color:#9fbfdc; font-size:0.95rem; text-align:center; max-width:46ch;">Drop atau pilih file video (.mp4/.mov). Klik <strong>PATCH</strong> untuk menyisipkan payload tanpa re-encoding lokal.</div>

            <div id="dropzone" class="drop-circle" style="width:300px;height:300px;margin-top:8px;">
                <div class="icon">⌘</div>
                <div class="title">Drop video</div>
                <div class="sub">MP4 · MOV · klik untuk pilih</div>
            </div>
            <input type="file" id="fileInput" accept=".mp4,.mov" style="display:none" />

            <div id="fileInfo" class="file-info" style="display:none; text-align:center;">
                <div id="fileName" style="font-weight:800;color:#e6fff3"></div>
                <div id="fileSize" style="color:#9be7c4;font-size:0.95rem"></div>
            </div>

            <div style="display:flex;gap:12px;justify-content:center;">
                <button id="patchBtn" class="btn-primary" disabled style="min-width:160px;">PATCH</button>
            </div>

            <div id="status" class="status" style="display:none"></div>

            <footer style="margin-top:18px;color:#7fb1d8;font-size:0.9rem;">Hanya 4 byte yang disisipkan — tidak ada re-encode lokal.</footer>
        </main>
    </div>

    <script>
        const PAYLOAD = 0x10000001; // 268435457
        const CHUNK_SIZE = 4 * 1024 * 1024; // 4MB chunks to avoid loading entire file
        let selectedFile = null;

        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const patchBtn = document.getElementById('patchBtn');
        const statusEl = document.getElementById('status');
        const fileInfoDiv = document.getElementById('fileInfo');
        const fileNameSpan = document.getElementById('fileName');
        const fileSizeSpan = document.getElementById('fileSize');
        const isMobile = /Mobi|Android|iPhone|iPad|iPod|Opera Mini|IEMobile|WPDesktop/i.test(navigator.userAgent) || navigator.maxTouchPoints > 0;
        const dropTitle = dropzone.querySelector('.title');
        const dropSub = dropzone.querySelector('.sub');

        if (isMobile) {
            dropTitle.textContent = 'Pilih video';
            dropSub.textContent = 'Tap untuk pilih file';
        }

        function showStatus(message, type = 'info') {
            statusEl.textContent = message;
            statusEl.className = `status status-${type}`;
            statusEl.style.display = 'block';
        }

        function hideStatus() {
            statusEl.style.display = 'none';
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
            return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
        }

        function handleFile(file) {
            if (!file) return;

            const name = file.name.toLowerCase();
            if (!name.endsWith('.mp4') && !name.endsWith('.mov')) {
                showStatus('❌ format tidak didukung · gunakan .mp4 atau .mov', 'error');
                selectedFile = null;
                fileInfoDiv.style.display = 'none';
                patchBtn.disabled = true;
                return;
            }

            selectedFile = file;
            fileNameSpan.textContent = file.name;
            fileSizeSpan.textContent = formatFileSize(file.size);
            fileInfoDiv.style.display = 'flex';

            showStatus(`✓ file siap dipatch · ${formatFileSize(file.size)}`, 'success');
            patchBtn.disabled = false;
        }

        dropzone.addEventListener('click', () => fileInput.click());

        // Prevent browser from opening files when dropped outside
        window.addEventListener('dragover', (e) => e.preventDefault());
        window.addEventListener('drop', (e) => e.preventDefault());

        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('drag-over');
        });

        dropzone.addEventListener('dragleave', () => {
            dropzone.classList.remove('drag-over');
        });

        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('drag-over');
            const file = e.dataTransfer.files[0];
            if (file) handleFile(file);
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files[0]) handleFile(e.target.files[0]);
        });

        // Chunked search for 'elst' atom to avoid loading whole file
        async function findElstIndex(file, onProgress) {
            const magic = [0x65, 0x6C, 0x73, 0x74]; // 'elst'
            const size = file.size;
            let pos = 0;
            let prevTail = new Uint8Array(0);

            while (pos < size) {
                const end = Math.min(pos + CHUNK_SIZE, size);
                const slice = file.slice(pos, end);
                const buffer = await slice.arrayBuffer();
                const chunk = new Uint8Array(buffer);

                // Combine tail (up to 3 bytes) with current chunk to catch boundary matches
                const combined = new Uint8Array(prevTail.length + chunk.length);
                combined.set(prevTail, 0);
                combined.set(chunk, prevTail.length);

                for (let i = 0; i <= combined.length - 4; i++) {
                    if (combined[i] === magic[0] && combined[i+1] === magic[1] && combined[i+2] === magic[2] && combined[i+3] === magic[3]) {
                        return pos - prevTail.length + i;
                    }
                }

                // keep last 3 bytes for overlap
                prevTail = combined.slice(Math.max(0, combined.length - 3));
                pos = end;
                if (onProgress) onProgress(Math.min(99, Math.floor((pos / size) * 100)));
                await new Promise(r => setTimeout(r, 0)); // yield to UI
            }

            return -1;
        }

        async function patchVideo(file) {
            showStatus('🔍 mencari atom elst...', 'info');
            const elstIndex = await findElstIndex(file, (p) => showStatus(`🔍 mencari atom elst... ${p}%`, 'info'));
            if (elstIndex === -1) throw new Error('atom \"elst\" tidak ditemukan · pastikan file MP4/MOV valid');

            const offset = elstIndex + 8;
            if (offset + 4 > file.size) throw new Error('file terlalu kecil untuk menyisipkan payload');

            const payloadBytes = new Uint8Array([
                (PAYLOAD >> 24) & 0xFF,
                (PAYLOAD >> 16) & 0xFF,
                (PAYLOAD >> 8) & 0xFF,
                PAYLOAD & 0xFF
            ]);

            // Create new Blob by concatenating three parts: before, payload, after
            const before = file.slice(0, offset);
            const after = file.slice(offset + 4);
            const outBlob = new Blob([before, payloadBytes, after], { type: file.type || 'video/mp4' });
            return outBlob;
        }

        patchBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            patchBtn.disabled = true;
            patchBtn.textContent = 'memproses...';
            dropzone.style.pointerEvents = 'none';

            try {
                const patchedBlob = await patchVideo(selectedFile);

                const url = URL.createObjectURL(patchedBlob);
                const a = document.createElement('a');
                a.href = url;
                const originalName = selectedFile.name.replace(/\.[^/.]+$/, '');
                const ext = selectedFile.name.split('.').pop();
                a.download = `${originalName}_clean.${ext}`;

                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                showStatus('✓ selesai · video sudah di-patch dan di-download · upload ke tiktok studio', 'success');
            } catch (err) {
                showStatus('✗ ' + (err && err.message ? err.message : err), 'error');
            } finally {
                patchBtn.disabled = false;
                patchBtn.textContent = 'patch video';
                dropzone.style.pointerEvents = '';
            }
        });


    </script>
</body>
</html>
